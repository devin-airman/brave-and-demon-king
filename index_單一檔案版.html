<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勇者與魔王</title>
  <meta name="description" content="《勇者與魔王》是一款極簡終端機風格的文字冒險 RPG。挑戰 5 層隨機地牢、15 種局內戰技與二階段心魔魔王！">
  <meta property="og:title" content="勇者與魔王">
  <meta property="og:description" content="《勇者與魔王》是一款極簡終端機風格的文字冒險 RPG。挑戰 5 層隨機地牢、15 種局內戰技與二階段心魔魔王！">
  <meta property="og:type" content="website">
  <style>
/* ===== 基本樣式：黑底白字終端機風格 ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #000;
  color: #e8e8e8;
  font-family: "Courier New", "Noto Sans Mono CJK TC", "Microsoft JhengHei", monospace;
  font-size: 16px;
  line-height: 1.6;
  display: flex;
  justify-content: center;
}
#game {
  width: 100%;
  max-width: 760px;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 14px 16px;
  gap: 10px;
}

/* ===== 第 1 部分：頂部勇者資訊欄（微藍光外框 + 極簡 3 行 + 可展開裝備抽屜） ===== */
#status {
  position: relative;
  background: #03060c;
  border: 1px solid #4da6ff;
  box-shadow: 0 0 12px rgba(77, 166, 255, 0.35), inset 0 0 8px rgba(77, 166, 255, 0.12);
  padding: 9px 14px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  border-radius: 2px;
}

.panel-row-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.panel-title {
  font-weight: bold;
  letter-spacing: 1px;
}
.header-actions {
  display: flex;
  gap: 6px;
}
.mini-btn {
  background: #000;
  color: #e8e8e8;
  border: 1px solid #888;
  font-family: inherit;
  font-size: 12.5px;
  padding: 2px 8px;
  cursor: pointer;
  letter-spacing: 0.5px;
}
@media (hover: hover) and (pointer: fine) {
  .mini-btn:hover {
    border-color: #fff;
    background: #222;
  }
}
.mini-btn:active {
  background: #262626;
}
.mini-btn.active {
  border-color: #4da6ff;
  color: #4da6ff;
}

/* 生命與護盾雙動態條（勇者與敵人共用） */
.bars-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  align-items: center;
}
.stat-bar-group {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
}
.stat-label {
  white-space: nowrap;
  font-weight: bold;
}
.bar-track {
  flex: 1;
  height: 11px;
  background: #1a1a1a;
  border: 1px solid #555;
  position: relative;
  overflow: hidden;
  min-width: 50px;
}
.bar-fill {
  height: 100%;
  position: relative;
  transition: width 260ms ease-out;
  z-index: 2;
}
.bar-ghost {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  background: rgba(255, 255, 255, 0.9);
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.85);
  transition: width 550ms ease-out 220ms;
  z-index: 1;
}
.bar-ghost.instant {
  transition: width 260ms ease-out 0ms;
}
.bar-fill.hp-hero { background: #38d399; }
.bar-fill.hp-enemy { background: #ff5252; }
.bar-fill.shield-fill {
  background: #5bc0be;
  transition: width 550ms ease-out; /* 第九版更新：延長護盾值減少與變化的平滑動畫 */
}
.stat-num {
  white-space: nowrap;
  font-size: 13px;
  min-width: 50px;
  text-align: right;
}

/* 第 3 行：上下對齊的雙攻雙防四格列 */
.stats-quad-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  font-size: 14px;
  padding-top: 2px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}
.stat-cell {
  white-space: nowrap;
}
.stat-cell .val {
  font-weight: bold;
  color: #fff;
}
.stat-cell .debuff {
  color: #ffd23f;
  font-weight: bold;
}

/* 5 格常駐裝備摺疊抽屜 */
#equip-drawer {
  margin-top: 4px;
  padding-top: 6px;
  border-top: 1px dashed rgba(77, 166, 255, 0.45);
  font-size: 14px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: #d0d8e8;
}

/* ===== 第 2 部分：獨立 3 行「敵人對戰卡」（依敵人名字顏色變換外框微光） ===== */
#enemy-panel {
  position: relative;
  overflow: hidden;
  background: #090406;
  border: 1px solid var(--enemy-glow, #ff5c5c);
  box-shadow: 0 0 12px var(--enemy-glow-soft, rgba(255, 92, 92, 0.38)),
              inset 0 0 8px var(--enemy-glow-inset, rgba(255, 92, 92, 0.14));
  padding: 9px 14px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  border-radius: 2px;
  transition: border-color 280ms ease, box-shadow 280ms ease;
}

/* 敵人面板專屬劈刀動畫（第十五版 v15 升級：尖銳刀尖＋錐形拖尾寒鋼劍氣，普通攻擊提速至 300ms 左下➔右上極速破空） */
#enemy-panel .enemy-panel-slash {
  position: absolute;
  top: 100%;
  left: 0%;
  width: var(--ep-diag-len, 104%);
  height: 9px;
  background: linear-gradient(180deg,
    rgba(77, 166, 255, 0) 0%,
    rgba(130, 200, 255, 0.9) 22%,
    #ffffff 42%,
    #ffffff 58%,
    rgba(130, 200, 255, 0.9) 78%,
    rgba(77, 166, 255, 0) 100%
  );
  clip-path: polygon(0% 50%, 15% 32%, 45% 12%, 74% 0%, 92% 18%, 100% 50%, 92% 82%, 74% 100%, 45% 88%, 15% 68%);
  filter: drop-shadow(0 0 6px #ffffff) drop-shadow(0 0 14px #4da6ff);
  transform-origin: 0% 50%;
  transform: translateY(-50%) rotate(calc(-1 * var(--ep-diag-angle, 9deg))) translateX(0%) scaleX(0);
  opacity: 0;
  pointer-events: none;
  z-index: 10;
}

#enemy-panel .enemy-panel-slash::after {
  content: "";
  position: absolute;
  right: 3%;
  top: 50%;
  width: 22px;
  height: 120%;
  transform: translateY(-50%);
  border-radius: 50%;
  background: radial-gradient(circle, #ffffff 0%, rgba(255, 255, 255, 0.85) 45%, transparent 75%);
  pointer-events: none;
}

#enemy-panel.slash-hit .enemy-panel-slash {
  animation: enemySlashBlToTr 300ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* 第十五版 v15 極速劍氣曲線：0%~28% 極速破空斬至終點 ➔ 28%~42% 白刃高光瞬間滯留 ➔ 42%~95% 錐形刀尾高速收束至終點角落 */
@keyframes enemySlashBlToTr {
  0% {
    transform: translateY(-50%) rotate(calc(-1 * var(--ep-diag-angle, 9deg))) translateX(0%) scaleX(0) scaleY(0.65);
    opacity: 1;
  }
  28% {
    transform: translateY(-50%) rotate(calc(-1 * var(--ep-diag-angle, 9deg))) translateX(0%) scaleX(1) scaleY(1.08);
    opacity: 1;
  }
  42% {
    transform: translateY(-50%) rotate(calc(-1 * var(--ep-diag-angle, 9deg))) translateX(8%) scaleX(0.92) scaleY(1);
    opacity: 1;
  }
  95% {
    transform: translateY(-50%) rotate(calc(-1 * var(--ep-diag-angle, 9deg))) translateX(100%) scaleX(0) scaleY(0.4);
    opacity: 1;
  }
  100% {
    transform: translateY(-50%) rotate(calc(-1 * var(--ep-diag-angle, 9deg))) translateX(100%) scaleX(0) scaleY(0.2);
    opacity: 0;
  }
}

@keyframes enemySlashTlToBr {
  0% {
    transform: translateY(-50%) rotate(var(--ep-diag-angle, 9deg)) translateX(0%) scaleX(0) scaleY(0.65);
    opacity: 1;
  }
  28% {
    transform: translateY(-50%) rotate(var(--ep-diag-angle, 9deg)) translateX(0%) scaleX(1) scaleY(1.12);
    opacity: 1;
  }
  42% {
    transform: translateY(-50%) rotate(var(--ep-diag-angle, 9deg)) translateX(8%) scaleX(0.92) scaleY(1);
    opacity: 1;
  }
  95% {
    transform: translateY(-50%) rotate(var(--ep-diag-angle, 9deg)) translateX(100%) scaleX(0) scaleY(0.4);
    opacity: 1;
  }
  100% {
    transform: translateY(-50%) rotate(var(--ep-diag-angle, 9deg)) translateX(100%) scaleX(0) scaleY(0.2);
    opacity: 0;
  }
}

/* 敵人面板受擊紅光（扣血）與金光（護盾抵扣或0傷） */
#enemy-panel.glow-red {
  animation: enemyGlowRed var(--hit-ms, 500ms) ease-out;
}
#enemy-panel.glow-gold {
  animation: enemyGlowGold var(--hit-ms, 500ms) ease-out;
}
@keyframes enemyGlowRed {
  0% { box-shadow: 0 0 0 0 transparent; }
  35% {
    box-shadow: 0 0 22px 6px var(--red, #ff3b3b), inset 0 0 14px var(--red, #ff3b3b);
    border-color: var(--red, #ff3b3b);
  }
  100% {
    box-shadow: 0 0 12px var(--enemy-glow-soft, rgba(255, 92, 92, 0.38)),
                inset 0 0 8px var(--enemy-glow-inset, rgba(255, 92, 92, 0.14));
  }
}
@keyframes enemyGlowGold {
  0% { box-shadow: 0 0 0 0 transparent; }
  35% {
    box-shadow: 0 0 22px 6px var(--gold, #ffd23f), inset 0 0 14px var(--gold, #ffd23f);
    border-color: var(--gold, #ffd23f);
  }
  100% {
    box-shadow: 0 0 12px var(--enemy-glow-soft, rgba(255, 92, 92, 0.38)),
                inset 0 0 8px var(--enemy-glow-inset, rgba(255, 92, 92, 0.14));
  }
}
.enemy-tag {
  font-size: 13.5px;
  color: #ffd23f;
  font-weight: bold;
}

.dim { color: #8a8a8a; }

/* ===== 第 3 部分：中間對話區（一般對話框 + 開戰文字漸隱 + 頂部拉下／底部收回戰鬥對話框） ===== */
#dialogue-stage {
  flex: 1;
  min-height: 0;
  position: relative;
  border: 1px solid #555;
  background: #000;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
#log {
  flex: 1;
  padding: 12px 14px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
#log p, #battle-log p { margin-bottom: 8px; }
#log .sep, #battle-log .sep, #history-content .sep { color: #555; margin: 8px 0; }
#log .hit, #battle-log .hit, #history-content .hit { color: #fff; }
#log .hurt, #battle-log .hurt, #history-content .hurt { color: #bbb; }
#log .big, #battle-log .big, #history-content .big { font-weight: bold; color: #fff; }
#log .text-curse, #battle-log .text-curse, #history-content .text-curse { color: #c792ea; font-weight: bold; }

/* 「戰鬥開始了！！！」文字出現並漸漸透明消失動畫層 */
#battle-intro-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.84);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 12;
  opacity: 0;
  pointer-events: none;
}
#battle-intro-overlay.active {
  pointer-events: all;
  animation: battleIntroBg var(--battle-intro-ms, 1100ms) ease forwards;
}
#battle-intro-overlay .intro-text {
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 4px;
  color: #fff;
  text-shadow: 0 0 14px rgba(255, 255, 255, 0.55);
  opacity: 0;
}
#battle-intro-overlay.active .intro-text {
  animation: battleIntroText var(--battle-intro-ms, 1100ms) ease-in-out forwards;
}
@keyframes battleIntroBg {
  0% { opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes battleIntroText {
  0% { opacity: 0; transform: scale(0.92); }
  28% { opacity: 1; transform: scale(1.03); }
  65% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.06); }
}

/* 從對話框頂部拉下、結束時從底部往上收回的專屬「戰鬥對話框」 */
#battle-drawer {
  position: absolute;
  inset: 0;
  background: #050508;
  border-bottom: 2px solid #e8e8e8;
  z-index: 10;
  display: flex;
  flex-direction: column;
  transform: translateY(-102%);
  transition: transform var(--battle-drawer-ms, 400ms) cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.9);
}
#battle-drawer.open {
  transform: translateY(0%);
}
#battle-drawer .drawer-header {
  padding: 6px 14px;
  background: #101018;
  border-bottom: 1px dashed #444;
  font-size: 13px;
  color: #bbb;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#battle-log {
  flex: 1;
  padding: 12px 14px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
#battle-drawer .drawer-footer-handle {
  height: 5px;
  background: repeating-linear-gradient(90deg, #444 0px, #444 8px, transparent 8px, transparent 14px);
}

/* 雙行戰報小卡片（第 2 行直接顯示算式，無「└ 算式：」前綴） */
.combat-report {
  border-left: 3px solid #4da6ff;
  background: rgba(255, 255, 255, 0.035);
  padding: 6px 10px;
  margin-bottom: 10px;
}
.combat-report.enemy-atk {
  border-left-color: #ff5c5c;
}
.combat-report .line-main {
  font-weight: bold;
  color: #fff;
  margin-bottom: 2px;
}
.combat-report .line-formula {
  font-size: 13.5px;
  color: #9e9e9e;
}

/* ===== 歷史對話視窗（戰鬥標題使用粗體，不使用金色） ===== */
#history-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-box {
  width: 100%;
  max-width: 680px;
  height: 80vh;
  background: #050508;
  border: 1px solid #e8e8e8;
  display: flex;
  flex-direction: column;
}
.modal-header {
  padding: 10px 14px;
  border-bottom: 1px solid #444;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;
}
.modal-body {
  flex: 1;
  padding: 12px 14px;
  overflow-y: auto;
  font-size: 14.5px;
  white-space: pre-wrap;
  word-break: break-word;
}
.modal-body p {
  margin-bottom: 6px;
}
.history-battle-header {
  margin: 12px 0 6px;
  padding: 4px 8px;
  background: #141418;
  border-left: 3px solid #e8e8e8;
  color: #fff;
  font-weight: bold;
}

/* ===== 第 4 部分：按鈕選項區（維持上下堆疊模式 + 極簡單行文字） ===== */
#choices {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
#choices button {
  background: #000;
  color: #e8e8e8;
  border: 1px solid #e8e8e8;
  font-family: inherit;
  font-size: 16px;
  padding: 11px 14px;
  text-align: left;
  cursor: pointer;
}
/* 名字上色；只有真正有滑鼠的裝置（電腦）才觸發 hover 反白，避免手機觸控殘留白底黑字 */
.name-boss { font-weight: bold; }
@media (hover: hover) and (pointer: fine) {
  #choices button:hover,
  #choices button:focus-visible { background: #e8e8e8; color: #000; outline: none; }
  #choices button:hover .name,
  #choices button:focus-visible .name,
  .menu button:hover .name,
  .menu button:focus-visible .name { color: inherit !important; }
}

/* 手機與電腦按住按鈕瞬間（active）：深灰底色，保留怪物名字原本顏色 */
#choices button:active,
.menu button:active,
#intro-screen .menu button:active { background: #262626; color: #e8e8e8; outline: none; }

@media (max-width: 480px) {
  body { font-size: 15px; }
  #game { padding: 8px 10px; gap: 8px; }
  #status, #enemy-panel { padding: 8px 10px; font-size: 14px; }
  .bars-row { gap: 8px; }
  .stats-quad-row { font-size: 13px; }
  #choices button { padding: 10px 12px; font-size: 15px; }
}

/* ===== 標題畫面 / 遊戲介紹畫面 ===== */
.screen {
  width: 100%;
  max-width: 760px;
  height: 100vh;
  height: 100dvh;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.hidden { display: none !important; }
#title-screen { justify-content: center; align-items: center; text-align: center; }
#title-screen .logo {
  font-size: 40px; font-weight: bold; letter-spacing: 8px;
  border: 1px solid #e8e8e8; padding: 18px 28px;
}
#title-screen .sub { color: #8a8a8a; }
#title-screen .cursor { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.menu { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; margin-top: 12px; }
.menu button, #intro-screen .menu button {
  background: #000; color: #e8e8e8; border: 1px solid #e8e8e8;
  font-family: inherit; font-size: 18px; padding: 14px; cursor: pointer;
}
@media (hover: hover) and (pointer: fine) {
  .menu button:hover, .menu button:focus-visible { background: #e8e8e8; color: #000; outline: none; }
}
#intro-screen .box { flex: 1; overflow-y: auto; border: 1px solid #555; padding: 14px 16px; }
#intro-screen h2 { font-size: 18px; margin: 4px 0 8px; letter-spacing: 2px; }
#intro-screen h2:not(:first-child) { margin-top: 18px; }
#intro-screen p, #intro-screen li { margin-bottom: 6px; }
#intro-screen ul { padding-left: 1.4em; }
#intro-screen .menu { flex-direction: row; max-width: none; margin-top: 0; }
#intro-screen .menu button { flex: 1; }

/* ===== 擲骰動畫 ===== */
#dice {
  position: fixed; inset: 0; z-index: 15; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; transition: opacity 120ms ease;
}
#dice.show { opacity: 1; pointer-events: all; }
#dice .dice-box {
  background: #000; border: 1px solid #e8e8e8; padding: 18px 28px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 240px; max-width: 90vw;
}
#dice .who { font-weight: bold; font-size: 18px; letter-spacing: 1px; }
#dice .face {
  width: 84px; height: 84px; border: 2px solid #e8e8e8; display: flex; align-items: center; justify-content: center;
  font-size: 40px; font-weight: bold; color: #fff;
}
#dice .face.rolling { animation: shake 200ms linear infinite; }
#dice .face.landed { animation: land 400ms ease-out; }
#dice .note { color: #8a8a8a; font-size: 14px; }
@keyframes shake {
  0% { transform: rotate(-12deg) translate(-2px, 1px); }
  50% { transform: rotate(10deg) translate(2px, -1px); }
  100% { transform: rotate(-12deg) translate(-2px, 1px); }
}
@keyframes land { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }

/* ===== 勇者揮劍 ===== */
#sword {
  position: fixed; inset: 0; z-index: 16; pointer-events: none; display: none;
  align-items: center; justify-content: center;
}
#sword.show { display: flex; }
#sword .blade {
  position: absolute; transform-origin: 50% 95%;
  filter: drop-shadow(0 0 6px #ffffff);
}
#sword.show .blade { animation: swing var(--sword-ms, 650ms) cubic-bezier(.3,.0,.2,1) forwards; }
#sword .slash {
  position: absolute; width: 260px; height: 260px; border-radius: 50%;
  border-top: 4px solid rgba(255,255,255,0.9); opacity: 0; transform: rotate(-40deg);
}
#sword.show .slash { animation: slash var(--sword-ms, 650ms) ease-out forwards; }
@keyframes swing {
  0% { transform: translateY(-40px) rotate(-75deg); opacity: 0; }
  20% { opacity: 1; }
  60% { transform: translateY(-40px) rotate(75deg); opacity: 1; }
  100% { transform: translateY(-40px) rotate(80deg); opacity: 0; }
}
@keyframes slash {
  0%, 30% { opacity: 0; transform: rotate(-60deg); }
  55% { opacity: 1; }
  100% { opacity: 0; transform: rotate(40deg); }
}

/* ===== 受到攻擊：金光（無傷）／搖動＋紅光（受傷） ===== */
#dialogue-stage.glow-gold, #log.glow-gold { animation: glowGold var(--hit-ms, 500ms) ease-out; }
#dialogue-stage.glow-red, #log.glow-red { animation: glowRed var(--hit-ms, 500ms) ease-out; }
@keyframes glowGold {
  0% { box-shadow: 0 0 0 0 transparent; border-color: #555; }
  35% { box-shadow: 0 0 18px 4px var(--gold, #ffd23f), inset 0 0 12px var(--gold, #ffd23f); border-color: var(--gold, #ffd23f); }
  100% { box-shadow: 0 0 0 0 transparent; border-color: #555; }
}
@keyframes glowRed {
  0% { box-shadow: 0 0 0 0 transparent; border-color: #555; }
  35% { box-shadow: 0 0 18px 4px var(--red, #ff2b2b), inset 0 0 12px var(--red, #ff2b2b); border-color: var(--red, #ff2b2b); }
  100% { box-shadow: 0 0 0 0 transparent; border-color: #555; }
}
#game.shake { animation: shakeScreen var(--hit-ms, 500ms) linear; }
@keyframes shakeScreen {
  0%, 100% { transform: translate(0, 0); }
  10% { transform: translate(-8px, 3px); }
  20% { transform: translate(7px, -4px); }
  30% { transform: translate(-6px, 4px); }
  40% { transform: translate(6px, -2px); }
  50% { transform: translate(-4px, 3px); }
  60% { transform: translate(4px, -2px); }
  70% { transform: translate(-3px, 1px); }
  80% { transform: translate(2px, -1px); }
  90% { transform: translate(-1px, 0); }
}

/* ===== 魔王出現動畫 ===== */
#boss-appear {
  position: fixed; inset: 0; z-index: 17; pointer-events: none; display: none;
  align-items: center; justify-content: center; background: rgba(0,0,0,0.5);
}
#boss-appear.show { display: flex; }
#boss-appear img {
  width: min(60vw, 300px); height: auto;
  filter: drop-shadow(0 0 18px rgba(255,0,0,0.7));
}
#boss-appear.show img { animation: bossAppear var(--boss-ms, 1800ms) ease-out forwards; }
@keyframes bossAppear {
  0% { transform: scale(var(--boss-from, 0.2)); opacity: 1; }
  100% { transform: scale(var(--boss-to, 1.8)); opacity: 0; }
}

/* ===== 劇情文字動畫 ===== */
#story {
  position: fixed; inset: 0; z-index: 18; display: none;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0); pointer-events: all;
}
#story.show { display: flex; }
#story .text {
  font-size: 26px; font-weight: bold; letter-spacing: 3px; line-height: 1.6; max-width: 700px; color: #fff;
  text-align: center; padding: 0 16px; opacity: 0;
  text-shadow: 0 0 12px rgba(255,255,255,0.35);
}
@media (max-width: 480px) { #story .text { font-size: 20px; letter-spacing: 2px; } }

/* ===== 轉場動畫：畫面淡出 → 掃描線掃過 → 新畫面淡入 ===== */
#fade {
  position: fixed; inset: 0; background: #000; pointer-events: none;
  opacity: 0; transition: opacity var(--fade-ms, 300ms) ease;
  z-index: 20;
}
#fade.on { opacity: 1; pointer-events: all; }
#fade .scan {
  position: absolute; left: 0; right: 0; height: 2px; top: -4px;
  background: #e8e8e8; box-shadow: 0 0 12px #e8e8e8; opacity: 0;
}
#fade.on .scan { animation: scan var(--scan-ms, 400ms) linear forwards; }
@keyframes scan { 0% { top: 0; opacity: 1; } 100% { top: 100%; opacity: 0.2; } }
.enter { animation: enter var(--fade-ms, 300ms) ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  #fade.on .scan, .enter, #title-screen .cursor, #dice .face, #sword .blade, #sword .slash, #game.shake, #boss-appear img { animation: none !important; }
}

@media (max-width: 480px) {
  #title-screen .logo { font-size: 30px; letter-spacing: 5px; padding: 14px 18px; }
  .screen { padding: 10px; }
}

/* ===== 模式選擇提示（按下開始遊戲後顯示） ===== */
.mode-prompt {
  color: #fff;
  font-weight: bold;
  font-size: 16px;
  letter-spacing: 2px;
  margin-bottom: 2px;
}

/* ===== 撲克模式：洗牌與抽一張撲克牌動畫（暗黑終端機黑底白框配色） ===== */
#poker-draw {
  position: fixed;
  inset: 0;
  z-index: 15;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.72);
  opacity: 0;
  pointer-events: none;
  transition: opacity 120ms ease;
}
#poker-draw.show {
  opacity: 1;
  pointer-events: all;
}
#poker-draw .poker-box {
  background: #000;
  border: 1px solid #e8e8e8;
  padding: 18px 26px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  min-width: 280px;
  max-width: 92vw;
  box-shadow: 0 0 28px rgba(0, 0, 0, 0.9);
}
#poker-draw .who {
  font-weight: bold;
  font-size: 18px;
  letter-spacing: 1px;
}
#poker-draw .stage-label {
  font-size: 13px;
  color: #aaa;
  min-height: 20px;
  letter-spacing: 1px;
}
#poker-draw .card-stage {
  position: relative;
  width: 170px;
  height: 190px;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 900px;
}
#poker-draw .deck-stack {
  position: absolute;
  width: 118px;
  height: 168px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.22s ease, transform 0.22s ease;
}
#poker-draw .deck-stack.recede {
  opacity: 0.22;
  transform: translateY(16px) scale(0.86);
}
#poker-draw .deck-card {
  position: absolute;
  width: 118px;
  height: 168px;
}
#poker-draw .deck-card:nth-child(1) { transform: translate(-4px, -3px) rotate(-3deg); }
#poker-draw .deck-card:nth-child(2) { transform: translate(2px, -1px) rotate(2deg); }
#poker-draw .deck-card:nth-child(3) { transform: translate(-2px, 2px) rotate(-1deg); }
#poker-draw .deck-card:nth-child(4) { transform: translate(3px, 3px) rotate(3deg); }

#poker-draw .deck-stack.shuffling .deck-card:nth-child(1) {
  animation: pokerShuffleLeft 250ms ease-in-out infinite alternate;
}
#poker-draw .deck-stack.shuffling .deck-card:nth-child(2) {
  animation: pokerShuffleRight 250ms ease-in-out infinite alternate;
}
#poker-draw .deck-stack.shuffling .deck-card:nth-child(3) {
  animation: pokerShuffleLeftDeep 250ms ease-in-out 60ms infinite alternate;
}
#poker-draw .deck-stack.shuffling .deck-card:nth-child(4) {
  animation: pokerShuffleRightDeep 250ms ease-in-out 60ms infinite alternate;
}

@keyframes pokerShuffleLeft {
  0% { transform: translate(0, 0) rotate(0deg); z-index: 1; }
  50% { transform: translate(-40px, -7px) rotate(-12deg); z-index: 4; }
  100% { transform: translate(4px, 2px) rotate(3deg); z-index: 3; }
}
@keyframes pokerShuffleRight {
  0% { transform: translate(0, 0) rotate(0deg); z-index: 2; }
  50% { transform: translate(40px, 6px) rotate(12deg); z-index: 1; }
  100% { transform: translate(-4px, -2px) rotate(-3deg); z-index: 4; }
}
@keyframes pokerShuffleLeftDeep {
  0% { transform: translate(-2px, 2px) rotate(-2deg); }
  50% { transform: translate(-24px, 9px) rotate(-7deg); }
  100% { transform: translate(5px, -3px) rotate(4deg); }
}
@keyframes pokerShuffleRightDeep {
  0% { transform: translate(2px, -2px) rotate(2deg); }
  50% { transform: translate(24px, -9px) rotate(7deg); }
  100% { transform: translate(-5px, 3px) rotate(-4deg); }
}

#poker-draw .drawn-card-wrapper {
  position: relative;
  width: 118px;
  height: 168px;
  z-index: 10;
  opacity: 0;
  transform: translateY(12px) scale(0.9);
  transform-style: preserve-3d;
}
#poker-draw .drawn-card-wrapper.drawing {
  opacity: 1;
  animation: pokerDrawAndFlip var(--poker-draw-ms, 620ms) cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
#poker-draw .drawn-card-wrapper.landed {
  opacity: 1;
  transform: translateY(0) scale(1.05) rotateY(0deg);
  animation: pokerLandPop 340ms ease-out forwards;
}

@keyframes pokerDrawAndFlip {
  0% { opacity: 1; transform: translateY(10px) scale(0.92) rotateY(180deg); }
  45% { opacity: 1; transform: translateY(-20px) scale(1.08) rotateY(90deg); }
  100% { opacity: 1; transform: translateY(0px) scale(1.04) rotateY(0deg); }
}
@keyframes pokerLandPop {
  0% { transform: scale(1.12); }
  60% { transform: scale(0.98); }
  100% { transform: scale(1.04); }
}

#poker-draw .drawn-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
#poker-draw .drawn-face.back {
  transform: rotateY(180deg);
}

/* 暗黑終端機撲克牌面（黑底白框）與牌背樣式 */
.poker-card {
  position: relative;
  width: 118px;
  height: 168px;
  background: #0b0b0e;
  border: 2px solid #e8e8e8;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.75), inset 0 0 0 1px #888888;
  border-radius: 8px;
  user-select: none;
  font-family: "Georgia", "Times New Roman", serif;
  overflow: hidden;
}
.poker-card.is-red { color: #ff3b3b; }
.poker-card.is-black { color: #f0f0f0; }

.poker-card .card-corner {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1;
  width: 22px;
  z-index: 2;
}
.poker-card .card-corner.top-left { top: 6px; left: 5px; }
.poker-card .card-corner.bottom-right { bottom: 6px; right: 5px; transform: rotate(180deg); }
.poker-card .corner-rank {
  font-size: 16px;
  font-weight: bold;
  letter-spacing: -0.5px;
  font-family: "Arial", "Helvetica", sans-serif;
}
.poker-card .corner-suit { font-size: 14px; margin-top: 1px; }

.poker-card .card-center {
  position: absolute;
  top: 14px;
  bottom: 14px;
  left: 24px;
  right: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.poker-card .pip-ace { font-size: 54px; line-height: 1; }
.poker-card .pip-grid { position: relative; width: 100%; height: 100%; }
.poker-card .pip {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: 22px;
  line-height: 1;
}
.poker-card .pip.inv { transform: translate(-50%, -50%) rotate(180deg); }
.poker-card .pip-grid.dense .pip { font-size: 19px; }

.poker-card .court-box {
  width: 100%;
  height: 100%;
  border: 1.5px solid rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.04);
  border-radius: 4px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.poker-card .court-box svg { width: 52px; height: 76px; overflow: visible; }
.poker-card .court-watermark {
  position: absolute;
  font-size: 11px;
  font-family: "Courier New", monospace;
  font-weight: bold;
  opacity: 0.8;
  bottom: 3px;
  letter-spacing: 0.5px;
}
.poker-card .court-suit-tl { position: absolute; top: 3px; left: 4px; font-size: 12px; line-height: 1; }
.poker-card .court-suit-br { position: absolute; bottom: 3px; right: 4px; font-size: 12px; line-height: 1; transform: rotate(180deg); }

.poker-card-back {
  width: 118px;
  height: 168px;
  background: #0d0d12;
  border: 2px solid #e8e8e8;
  border-radius: 8px;
  padding: 6px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.75);
  user-select: none;
  position: relative;
  overflow: hidden;
}
.poker-card-back .card-back-inner {
  width: 100%;
  height: 100%;
  border: 1.5px solid #888;
  border-radius: 4px;
  background-color: #12121a;
  background-image:
    repeating-linear-gradient(45deg, rgba(232,232,232,0.08) 0px, rgba(232,232,232,0.08) 2px, transparent 2px, transparent 8px),
    repeating-linear-gradient(-45deg, rgba(232,232,232,0.08) 0px, rgba(232,232,232,0.08) 2px, transparent 2px, transparent 8px);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #e8e8e8;
}
.poker-card-back .card-back-emblem {
  width: 42px;
  height: 42px;
  border: 1.5px solid #aaa;
  transform: rotate(45deg);
  display: flex;
  align-items: center;
  justify-content: center;
  background: #09090d;
}
.poker-card-back .card-back-emblem span {
  transform: rotate(-45deg);
  font-family: "Courier New", monospace;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1px;
  color: #fff;
}

#poker-draw .value-badge {
  font-size: 15px;
  font-weight: bold;
  color: #ffd23f;
  min-height: 22px;
}
#poker-draw .note {
  color: #8a8a8a;
  font-size: 14px;
  min-height: 20px;
}

/* ===== 第七版新增：左上角「測試者」按鈕與樓層選擇視窗 ===== */
.panel-title-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.tester-btn {
  background: transparent;
  color: transparent;
  border: 1px solid transparent;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: bold;
  padding: 2px 8px;
  cursor: pointer;
  letter-spacing: 0.5px;
  opacity: 0;
  user-select: none;
  outline: none;
}
@media (hover: hover) and (pointer: fine) {
  .tester-btn:hover,
  .tester-btn:focus-visible {
    background: transparent;
    color: transparent;
    border-color: transparent;
    opacity: 0;
    outline: none;
  }
}
.tester-btn:active,
.tester-btn:focus {
  background: transparent;
  color: transparent;
  border-color: transparent;
  opacity: 0;
  outline: none;
}
#tester-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  z-index: 28;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.tester-modal-box {
  width: 100%;
  max-width: 480px;
  background: #050508;
  border: 1px solid #ffd23f;
  box-shadow: 0 0 18px rgba(255, 210, 63, 0.3);
  display: flex;
  flex-direction: column;
}
.tester-modal-header {
  padding: 10px 14px;
  border-bottom: 1px solid #444;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;
  color: #ffd23f;
}
.tester-modal-body {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-size: 14.5px;
}
.tester-floor-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 4px;
}
.tester-floor-list button {
  background: #000;
  color: #e8e8e8;
  border: 1px solid #e8e8e8;
  font-family: inherit;
  font-size: 15px;
  padding: 10px 12px;
  text-align: left;
  cursor: pointer;
}
@media (hover: hover) and (pointer: fine) {
  .tester-floor-list button:hover {
    background: #e8e8e8;
    color: #000;
  }
}
.tester-floor-list button:active {
  background: #262626;
  color: #e8e8e8;
}

/* 撲克特殊效果提示（取代牌面下方算式） */
.poker-special-hint {
  color: #ffd23f;
  font-weight: bold;
  font-size: 15px;
  letter-spacing: 1px;
}

/* 戰鬥拉簾內的結算提示小卡片 */
.combat-report.victory-report {
  background: rgba(255, 210, 63, 0.08);
  border: 1px solid rgba(255, 210, 63, 0.45);
  box-shadow: 0 0 8px rgba(255, 210, 63, 0.2);
  text-align: center;
  padding: 8px 10px;
}

/* 黑幕劇情文字跳過提示 */
#story {
  cursor: pointer;
}
#story .skip-hint {
  position: absolute;
  bottom: 22px;
  font-size: 12.5px;
  color: #666;
  letter-spacing: 1px;
  pointer-events: none;
}


/* ===== 第九版新增：裝備文字縮小消失動畫（紫色，延長至 2.5 秒且徹底杜絕二次閃現） ===== */
#equip-anim-overlay {
  position: fixed;
  inset: 0;
  z-index: 19;
  background: rgba(0, 0, 0, 0.76);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: all;
  transition: opacity 280ms ease;
}
#equip-anim-overlay.show {
  opacity: 1;
}
.equip-anim-char {
  color: #c084fc;
  font-size: 76px;
  font-weight: bold;
  font-family: inherit;
  text-shadow: 0 0 24px rgba(192, 132, 252, 0.85), 0 0 48px rgba(168, 85, 247, 0.65);
  transform: scale(0);
  opacity: 0;
}
#equip-anim-overlay.animating .equip-anim-char {
  animation: equipCharShrink 2500ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
@keyframes equipCharShrink {
  0% { transform: scale(1.45); opacity: 0; }
  15% { transform: scale(1); opacity: 1; }
  55% { transform: scale(0.92); opacity: 0.95; }
  100% { transform: scale(0.01); opacity: 0; }
}

/* ===== 第九版新增：全螢幕文字消失轉場（黃色）與傳送門白色掃描線 ===== */
#text-fade-overlay {
  position: fixed;
  inset: 0;
  z-index: 19;
  background: rgba(0, 0, 0, 0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: all;
  transition: opacity 300ms ease;
}
#text-fade-overlay.show {
  opacity: 1;
}
#text-fade-overlay .fade-content {
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 2px;
  color: #ffd23f;
  text-align: center;
  padding: 0 20px;
  text-shadow: 0 0 16px rgba(255, 210, 63, 0.65);
  opacity: 0;
}
@media (max-width: 480px) {
  #text-fade-overlay .fade-content {
    font-size: 20px;
  }
}
#text-fade-overlay.animating .fade-content {
  animation: textFadeScreenAnim var(--fade-text-ms, 2800ms) cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
@keyframes textFadeScreenAnim {
  0% { opacity: 0; transform: scale(0.92); }
  18% { opacity: 1; transform: scale(1); }
  68% { opacity: 0.98; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.06); }
}

/* 傳送門掃描線閃爍動畫（延長並流暢掃描兩次） */
#text-fade-overlay .fade-scanline {
  display: none;
  position: absolute;
  left: 0;
  right: 0;
  height: 3px;
  top: 0;
  background: #ffffff;
  box-shadow: 0 0 16px #ffffff, 0 0 32px #4da6ff;
  opacity: 0;
  pointer-events: none;
}
#text-fade-overlay.with-scanline .fade-scanline {
  display: block;
  animation: portalScanFlash var(--fade-text-ms, 3000ms) ease-in-out forwards;
}
@keyframes portalScanFlash {
  0% { top: 0; opacity: 0; }
  12% { opacity: 1; }
  46% { top: 100%; opacity: 0.85; }
  50% { top: 0; opacity: 0; }
  58% { top: 0; opacity: 1; }
  94% { top: 100%; opacity: 0.85; }
  100% { top: 100%; opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  #equip-anim-overlay.animating .equip-anim-char,
  #text-fade-overlay.animating .fade-content,
  #text-fade-overlay.with-scanline .fade-scanline {
    animation: none !important;
  }
}

/* ===== 第十版（v10）新增：護盾冰白殘影、冰藍色護盾光效（完全擋下）與冰藍色護盾破碎效果（護盾歸零） ===== */
:root {
  --ice-cyan: #5ce1e6;
  --ice-bright: #aef6ff;
  --ice-deep: #00a8e8;
}

.bar-ghost.shield-ghost {
  background: rgba(174, 246, 255, 0.92);
  box-shadow: 0 0 10px rgba(92, 225, 230, 0.95);
  transition: width 620ms ease-out 200ms;
}

/* 護盾特效內部圖層（作用於 #enemy-panel 與 #dialogue-stage，無額外文字提示） */
.shield-fx-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 12;
  overflow: hidden;
}

.shield-wave-sweep {
  position: absolute;
  inset: -20% -40%;
  background: linear-gradient(
    115deg,
    transparent 25%,
    rgba(92, 225, 230, 0.08) 40%,
    rgba(174, 246, 255, 0.48) 50%,
    rgba(92, 225, 230, 0.12) 60%,
    transparent 75%
  );
  transform: translateX(-100%);
  opacity: 0;
}

.shield-hex-barrier {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle at 50% 50%, rgba(92, 225, 230, 0.24) 0%, rgba(0, 168, 232, 0.08) 65%, transparent 100%),
    repeating-linear-gradient(60deg, rgba(174, 246, 255, 0.14) 0px, rgba(174, 246, 255, 0.14) 1px, transparent 1px, transparent 14px),
    repeating-linear-gradient(-60deg, rgba(174, 246, 255, 0.14) 0px, rgba(174, 246, 255, 0.14) 1px, transparent 1px, transparent 14px);
  opacity: 0;
}

.shield-crack-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  filter: drop-shadow(0 0 8px #5ce1e6) drop-shadow(0 0 14px #00a8e8);
}

.ice-shards-container {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.ice-shard {
  position: absolute;
  left: var(--sx, 50%);
  top: var(--sy, 50%);
  width: var(--sw, 12px);
  height: var(--sh, 12px);
  background: linear-gradient(135deg, #ffffff 0%, #aef6ff 45%, #38bdf8 100%);
  clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
  box-shadow: 0 0 10px #5ce1e6;
  opacity: 0;
  transform: translate(-50%, -50%) scale(0);
}

/* 1. 護盾完全擋下攻擊：冰藍色護盾光效 (.glow-ice-shield) */
#enemy-panel.glow-ice-shield {
  animation: enemyGlowIceShield 650ms ease-out forwards;
}
#dialogue-stage.glow-ice-shield, #log.glow-ice-shield {
  animation: dialogueGlowIceShield 650ms ease-out forwards;
}
.glow-ice-shield .shield-wave-sweep {
  animation: shieldWaveSweepAnim 620ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.glow-ice-shield .shield-hex-barrier {
  animation: shieldHexPulseAnim 650ms ease-out forwards;
}
.bar-track.shield-track-glow {
  border-color: #aef6ff !important;
  box-shadow: 0 0 12px rgba(92, 225, 230, 0.9), inset 0 0 6px rgba(174, 246, 255, 0.6) !important;
}

@keyframes enemyGlowIceShield {
  0% { box-shadow: 0 0 0 0 transparent; }
  35% {
    box-shadow: 0 0 22px 6px var(--ice-cyan, #5ce1e6), inset 0 0 16px var(--ice-bright, #aef6ff);
    border-color: var(--ice-bright, #aef6ff);
  }
  100% {
    box-shadow: 0 0 12px var(--enemy-glow-soft, rgba(255, 92, 92, 0.38)),
                inset 0 0 8px var(--enemy-glow-inset, rgba(255, 92, 92, 0.14));
  }
}

@keyframes dialogueGlowIceShield {
  0% { box-shadow: 0 0 0 0 transparent; border-color: #555; }
  35% {
    box-shadow: 0 0 20px 5px var(--ice-cyan, #5ce1e6), inset 0 0 16px var(--ice-bright, #aef6ff);
    border-color: var(--ice-bright, #aef6ff);
  }
  100% { box-shadow: 0 0 0 0 transparent; border-color: #555; }
}

@keyframes shieldWaveSweepAnim {
  0% { transform: translateX(-90%); opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 0.9; }
  100% { transform: translateX(90%); opacity: 0; }
}

@keyframes shieldHexPulseAnim {
  0% { opacity: 0; }
  25% { opacity: 1; }
  70% { opacity: 0.55; }
  100% { opacity: 0; }
}

/* 2. 護盾歸零：冰藍色護盾破碎效果 (.shatter-ice-shield) */
#enemy-panel.shatter-ice-shield {
  animation: enemyIceShatterAnim 760ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
#dialogue-stage.shatter-ice-shield, #log.shatter-ice-shield {
  animation: dialogueIceShatterAnim 760ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.shatter-ice-shield .shield-crack-svg {
  animation: crackFlashAnim 740ms ease-out forwards;
}
.shatter-ice-shield .ice-shard {
  animation: shardExplodeAnim 750ms cubic-bezier(0.15, 0.85, 0.25, 1) forwards;
}
.bar-track.shield-track-shatter {
  animation: shieldBarShatterFlash 740ms ease-out forwards;
}

@keyframes enemyIceShatterAnim {
  0% {
    transform: translate(0, 0);
    border-color: #ffffff;
    box-shadow: 0 0 28px 8px rgba(174, 246, 255, 0.95), inset 0 0 22px rgba(255, 255, 255, 0.85);
  }
  14% { transform: translate(-6px, 2px); border-color: #aef6ff; }
  28% { transform: translate(6px, -3px); border-color: #5ce1e6; }
  42% {
    transform: translate(-4px, -2px);
    box-shadow: 0 0 20px 5px rgba(92, 225, 230, 0.8), inset 0 0 14px rgba(92, 225, 230, 0.5);
  }
  58% { transform: translate(3px, 1px); }
  100% {
    transform: translate(0, 0);
    box-shadow: 0 0 12px var(--enemy-glow-soft, rgba(255, 92, 92, 0.38)),
                inset 0 0 8px var(--enemy-glow-inset, rgba(255, 92, 92, 0.14));
  }
}

@keyframes dialogueIceShatterAnim {
  0% {
    border-color: #ffffff;
    box-shadow: 0 0 26px 7px rgba(174, 246, 255, 0.95), inset 0 0 24px rgba(255, 255, 255, 0.85);
  }
  30% {
    border-color: #aef6ff;
    box-shadow: 0 0 20px 5px rgba(92, 225, 230, 0.85), inset 0 0 16px rgba(92, 225, 230, 0.6);
  }
  65% {
    border-color: #5ce1e6;
    box-shadow: 0 0 12px 3px rgba(0, 168, 232, 0.45), inset 0 0 8px rgba(0, 168, 232, 0.25);
  }
  100% {
    box-shadow: 0 0 0 0 transparent;
    border-color: #555;
  }
}

@keyframes crackFlashAnim {
  0% { opacity: 0; transform: scale(0.94); }
  14% { opacity: 1; transform: scale(1); }
  52% { opacity: 0.95; transform: scale(1.01); }
  100% { opacity: 0; transform: scale(1.06); }
}

@keyframes shardExplodeAnim {
  0% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
  }
  20% {
    opacity: 1;
    transform: translate(calc(-50% + var(--tx) * 0.45), calc(-50% + var(--ty) * 0.45)) scale(1.15) rotate(calc(var(--rot) * 0.4));
  }
  100% {
    opacity: 0;
    transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.15) rotate(var(--rot));
  }
}

@keyframes shieldBarShatterFlash {
  0%, 25% {
    border-color: #ffffff;
    box-shadow: 0 0 16px 4px #aef6ff, inset 0 0 10px #ffffff;
  }
  60% {
    border-color: #5ce1e6;
    box-shadow: 0 0 10px 2px #00a8e8;
  }
  100% {
    border-color: #555;
    box-shadow: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .glow-ice-shield .shield-wave-sweep,
  .glow-ice-shield .shield-hex-barrier,
  .shatter-ice-shield .shield-crack-svg,
  .shatter-ice-shield .ice-shard {
    animation: none !important;
  }
}


/* ===== 第十一版（v11）新增：局內技能系統樣式（技能按鈕紅/藍/綠分類邊框、頂部技能與裝備浮動詳情版面） ===== */

/* 頂部【技能 ▼】與【裝備 ▼】向下覆蓋展開的獨立浮動小版面（附關閉按鈕，不擠壓戰鬥與對話框高度） */
#equip-drawer,
#skill-drawer {
  position: absolute;
  top: calc(100% + 4px);
  left: -1px;
  right: -1px;
  z-index: 24;
  margin-top: 0;
  padding: 10px 14px 12px;
  background: #050811;
  border: 1px solid #4da6ff;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.94), 0 0 14px rgba(77, 166, 255, 0.35);
  border-radius: 2px;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  color: #d0d8e8;
  max-height: 68vh;
  overflow-y: auto;
}

.floating-drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 6px;
  margin-bottom: 2px;
  border-bottom: 1px dashed rgba(77, 166, 255, 0.45);
  font-weight: bold;
  color: #7ec8ff;
}

.skill-detail-card {
  padding: 8px 10px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid #555;
  border-left-width: 4px;
  border-radius: 2px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.skill-detail-card.cat-attack {
  border-color: rgba(255, 77, 77, 0.55);
  border-left-color: #ff4d4d;
}
.skill-detail-card.cat-defense {
  border-color: rgba(255, 210, 63, 0.55);
  border-left-color: #ffd23f;
}
.skill-detail-card.cat-charge {
  border-color: rgba(56, 211, 153, 0.55);
  border-left-color: #38d399;
}
.skill-detail-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;
  color: #ffffff;
  gap: 8px;
  flex-wrap: wrap;
}
.skill-cat-badge {
  font-size: 12px;
  padding: 1px 6px;
  border-radius: 2px;
  font-weight: bold;
}
.skill-cat-badge.cat-attack {
  color: #ff8080;
  border: 1px solid #ff4d4d;
  background: rgba(255, 77, 77, 0.12);
}
.skill-cat-badge.cat-defense {
  color: #ffe066;
  border: 1px solid #ffd23f;
  background: rgba(255, 210, 63, 0.12);
}
.skill-cat-badge.cat-charge {
  color: #6ee7b7;
  border: 1px solid #38d399;
  background: rgba(56, 211, 153, 0.12);
}
.skill-detail-desc {
  font-size: 13.5px;
  color: #c8d0dc;
  line-height: 1.5;
}

/* 技能按鈕分類邊框顏色（攻擊：紅色 #ff4d4d，防禦：藍色 #4da6ff，蓄力：綠色 #38d399） */
#choices button.skill-btn-attack {
  border: 1.5px solid #ff4d4d;
  box-shadow: 0 0 8px rgba(255, 77, 77, 0.28), inset 3px 0 0 #ff4d4d;
}
#choices button.skill-btn-defense {
  border: 1.5px solid #ffd23f;
  box-shadow: 0 0 8px rgba(255, 210, 63, 0.28), inset 3px 0 0 #ffd23f;
}
#choices button.skill-btn-charge {
  border: 1.5px solid #38d399;
  box-shadow: 0 0 8px rgba(56, 211, 153, 0.28), inset 3px 0 0 #38d399;
}

@media (hover: hover) and (pointer: fine) {
  #choices button.skill-btn-attack:not(:disabled):hover,
  #choices button.skill-btn-attack:not(:disabled):focus-visible {
    background: #2b0b0e;
    color: #ffffff;
    border-color: #ff6b6b;
    box-shadow: 0 0 14px rgba(255, 77, 77, 0.55), inset 4px 0 0 #ff4d4d;
  }
  #choices button.skill-btn-defense:not(:disabled):hover,
  #choices button.skill-btn-defense:not(:disabled):focus-visible {
    background: #261f06;
    color: #ffffff;
    border-color: #ffe066;
    box-shadow: 0 0 14px rgba(255, 210, 63, 0.55), inset 4px 0 0 #ffd23f;
  }
  #choices button.skill-btn-charge:not(:disabled):hover,
  #choices button.skill-btn-charge:not(:disabled):focus-visible {
    background: #072218;
    color: #ffffff;
    border-color: #6ee7b7;
    box-shadow: 0 0 14px rgba(56, 211, 153, 0.55), inset 4px 0 0 #38d399;
  }
}

/* 冷卻中或未達條件之禁用技能按鈕：保留分類邊框色系但降低亮度並鎖定點擊 */
#choices button:disabled,
#choices button.skill-btn-disabled {
  opacity: 0.55;
  color: #888888 !important;
  background: #050507 !important;
  cursor: not-allowed;
}


/* =========================================================
   第十二版（v12）新增：
   1. 技能圖鑑畫面與頂部分類切換按鈕（全部／攻擊紅／防禦黃／蓄力綠）
   2. 全按鈕向下凹按壓效果、技能按鈕專屬能量擴散光圈、CD 歸 0 微光提醒
   3. 頂部勇者護盾條「左藍右黃」雙色分段、黃色護盾格擋網格與黃色碎裂碎片
   4. 全域加血（綠字 +X）、技能加護盾（黃字 +X）、全屬性覺醒（綠字 +5）浮動跳字
   5. 獲得技能飛入頂部按鈕動畫、蓄力綠光圈聚點飛入頂部 Buff 標籤與消耗飛走動畫
   6. 全 15 種技能專屬視覺特效（全數不震動螢幕）
   ========================================================= */

/* ── 1. 標題畫面「技能圖鑑」與分類篩選按鈕 ── */
#compendium-screen .compendium-header {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
#compendium-screen .compendium-title {
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 2px;
  text-align: center;
  color: #ffffff;
}
.compendium-tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.comp-tab {
  background: #05060a;
  color: #cccccc;
  border: 1px solid #777777;
  font-family: inherit;
  font-size: 14px;
  font-weight: bold;
  padding: 8px 6px;
  cursor: pointer;
  text-align: center;
  border-radius: 2px;
  transition: background 150ms ease, color 150ms ease, box-shadow 150ms ease, transform 80ms ease;
}
.comp-tab.tab-attack {
  border-color: rgba(255, 77, 77, 0.65);
  color: #ff9999;
}
.comp-tab.tab-defense {
  border-color: rgba(255, 210, 63, 0.65);
  color: #ffe066;
}
.comp-tab.tab-charge {
  border-color: rgba(56, 211, 153, 0.65);
  color: #6ee7b7;
}
.comp-tab.active {
  background: #e8e8e8;
  color: #000000;
  border-color: #ffffff;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.45);
}
.comp-tab.tab-attack.active {
  background: #ff4d4d;
  color: #000000;
  border-color: #ff9999;
  box-shadow: 0 0 12px rgba(255, 77, 77, 0.65);
}
.comp-tab.tab-defense.active {
  background: #ffd23f;
  color: #000000;
  border-color: #fff099;
  box-shadow: 0 0 12px rgba(255, 210, 63, 0.65);
}
.comp-tab.tab-charge.active {
  background: #38d399;
  color: #000000;
  border-color: #a7f3d0;
  box-shadow: 0 0 12px rgba(56, 211, 153, 0.65);
}
#compendium-screen .compendium-list {
  flex: 1;
  overflow-y: auto;
  border: 1px solid #555;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: #030408;
}
#compendium-screen .menu {
  flex-direction: row;
  max-width: none;
  margin-top: 0;
}
#compendium-screen .menu button {
  flex: 1;
}
.comp-section-header {
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 1px;
  padding: 4px 8px;
  margin-top: 4px;
  border-left: 3px solid #e8e8e8;
  background: rgba(255, 255, 255, 0.04);
}
.comp-section-header.cat-attack { border-left-color: #ff4d4d; color: #ff8080; }
.comp-section-header.cat-defense { border-left-color: #ffd23f; color: #ffe066; }
.comp-section-header.cat-charge { border-left-color: #38d399; color: #6ee7b7; }

/* ── 2. 全遊戲所有按鈕「向下凹」效果 ＋ 技能按鈕專屬能量擴散 ＋ CD 歸 0 微光 ── */
button:not(:disabled):not(.tester-btn) {
  transition: transform 75ms ease, box-shadow 140ms ease, background-color 140ms ease;
}
#choices button:not(:disabled):active,
.menu button:not(:disabled):active,
#intro-screen .menu button:not(:disabled):active,
#compendium-screen .menu button:not(:disabled):active,
.mini-btn:not(:disabled):active,
.comp-tab:not(:disabled):active,
.tester-floor-list button:not(:disabled):active {
  transform: translateY(2.5px) scale(0.985) !important;
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.75) !important;
}

/* 技能冷卻完畢（CD 由 1 歸 0）時的邊框微光提醒 */
#choices button.skill-cd-ready {
  animation: skillCdReadyPulse 2200ms ease-out 1;
}
@keyframes skillCdReadyPulse {
  0% { filter: brightness(1); }
  30% { filter: brightness(1.65); box-shadow: 0 0 18px 4px rgba(255, 255, 255, 0.75); }
  100% { filter: brightness(1); }
}

/* 技能按鈕按下時的專屬向外擴散能量光圈（浮於 #fx-flight-layer 上） */
.skill-energy-ripple {
  position: fixed;
  pointer-events: none;
  border: 2px solid var(--ripple-color, #ffffff);
  box-shadow: 0 0 14px var(--ripple-color, #ffffff), inset 0 0 8px var(--ripple-color, #ffffff);
  border-radius: 3px;
  z-index: 40;
  animation: skillEnergyRippleOut 920ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes skillEnergyRippleOut {
  0% {
    opacity: 0.95;
    transform: scale(1);
  }
  100% {
    opacity: 0;
    transform: scaleX(1.08) scaleY(1.45);
  }
}

/* ── 3. 頂部勇者面板多 Buff 並列標籤系統（#hero-panel-tag）與未消耗保留提示 ── */
.hero-buff-tag {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  font-weight: bold;
  color: #6ee7b7;
  letter-spacing: 0.4px;
}
.hero-buff-pill {
  display: inline-flex;
  align-items: center;
  padding: 1px 6px;
  border-radius: 2px;
  white-space: nowrap;
  line-height: 1.35;
}
.hero-buff-pill.buff-cat-attack {
  color: #ff9999;
  border: 1px solid rgba(255, 77, 77, 0.8);
  background: rgba(255, 77, 77, 0.14);
  text-shadow: 0 0 6px rgba(255, 77, 77, 0.45);
}
.hero-buff-pill.buff-cat-defense {
  color: #ffe066;
  border: 1px solid rgba(255, 210, 63, 0.8);
  background: rgba(255, 210, 63, 0.14);
  text-shadow: 0 0 6px rgba(255, 210, 63, 0.45);
}
.hero-buff-pill.buff-cat-charge {
  color: #6ee7b7;
  border: 1px solid rgba(56, 211, 153, 0.8);
  background: rgba(56, 211, 153, 0.14);
  text-shadow: 0 0 6px rgba(56, 211, 153, 0.45);
}
.hero-buff-pill.pop-in,
.hero-buff-tag.pop-in {
  animation: buffTagPopIn 720ms cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes buffTagPopIn {
  0% { transform: scale(0.6); opacity: 0; filter: brightness(1.8); }
  60% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); opacity: 1; filter: brightness(1); }
}
#log .charge-keep-hint,
#battle-log .charge-keep-hint,
#history-content .charge-keep-hint {
  color: #6ee7b7;
  font-size: 13.5px;
  font-weight: bold;
}

/* ── 4. 頂部勇者護盾條「左藍右黃」雙色分段 ＋ 黃色護盾網格光效與黃色碎裂碎片 ── */
.bar-fill.shield-fill-yellow {
  position: absolute;
  top: 0;
  height: 100%;
  background: linear-gradient(90deg, #ffd23f 0%, #ffe885 100%);
  box-shadow: 0 0 8px rgba(255, 210, 63, 0.65);
  transition: left 550ms ease-out, width 550ms ease-out;
  z-index: 3;
}

/* 黃色護盾完全擋下攻擊（.glow-yellow-shield，不震動螢幕） */
#dialogue-stage.glow-yellow-shield, #log.glow-yellow-shield {
  animation: dialogueGlowYellowShield 1300ms ease-out forwards;
}
.glow-yellow-shield .shield-wave-sweep {
  background: linear-gradient(
    115deg,
    transparent 25%,
    rgba(255, 210, 63, 0.12) 40%,
    rgba(255, 238, 153, 0.52) 50%,
    rgba(255, 210, 63, 0.14) 60%,
    transparent 75%
  );
  animation: shieldWaveSweepAnim 1240ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.glow-yellow-shield .shield-hex-barrier {
  background-image:
    radial-gradient(circle at 50% 50%, rgba(255, 210, 63, 0.26) 0%, rgba(245, 158, 11, 0.08) 65%, transparent 100%),
    repeating-linear-gradient(60deg, rgba(255, 232, 133, 0.18) 0px, rgba(255, 232, 133, 0.18) 1px, transparent 1px, transparent 14px),
    repeating-linear-gradient(-60deg, rgba(255, 232, 133, 0.18) 0px, rgba(255, 232, 133, 0.18) 1px, transparent 1px, transparent 14px);
  animation: shieldHexPulseAnim 1300ms ease-out forwards;
}
.bar-track.shield-track-glow-yellow {
  border-color: #ffe885 !important;
  box-shadow: 0 0 12px rgba(255, 210, 63, 0.9), inset 0 0 6px rgba(255, 232, 133, 0.6) !important;
}
@keyframes dialogueGlowYellowShield {
  0% { box-shadow: 0 0 0 0 transparent; border-color: #555; }
  35% {
    box-shadow: 0 0 20px 5px #ffd23f, inset 0 0 16px #ffe885;
    border-color: #ffe885;
  }
  100% { box-shadow: 0 0 0 0 transparent; border-color: #555; }
}

/* 黃色護盾歸零碎裂（.shatter-yellow-shield，不震動螢幕） */
#dialogue-stage.shatter-yellow-shield, #log.shatter-yellow-shield {
  animation: dialogueYellowShatterAnim 1520ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.shatter-yellow-shield .shield-crack-svg {

/* ── 7. 全 15 種技能專屬視覺特效（全數不震動螢幕） ── */

/* (1) 直接攻擊技能（【破盾斬】、【捨身決絕】）：第十五版 v15 升級 480ms 微時間差雙刀交錯白熱電漿刃 ＋ 中心聚能光爆環 */
#enemy-panel .enemy-panel-slash-2 {
  position: absolute;
  top: 100%;
  left: 0%;
  width: var(--ep-diag-len, 104%);
  height: 18px;
  background: linear-gradient(180deg,
    rgba(255, 23, 68, 0) 0%,
    rgba(255, 77, 77, 0.95) 20%,

    #ffffff 62%,
    rgba(255, 77, 77, 0.95) 80%,

  );

}

  content: "";
  position: absolute;
  right: 3%;
  top: 50%;
  width: 26px;
  height: 120%;

  border-radius: 50%;
  background: radial-gradient(circle, #ffffff 0%, rgba(255, 255, 255, 0.9) 45%, transparent 75%);

}
#enemy-panel.slash-x-red .enemy-panel-slash {
  top: 0%;
  left: 0%;
  height: 18px;
  background: linear-gradient(180deg,
    rgba(255, 23, 68, 0) 0%,
    rgba(255, 77, 77, 0.95) 20%,
    #ffffff 38%,
    #ffffff 62%,
    rgba(255, 77, 77, 0.95) 80%,
    rgba(255, 23, 68, 0) 100%
  );
  filter: drop-shadow(0 0 8px #ff4d4d) drop-shadow(0 0 18px #ff1744);
  animation: enemySlashTlToBr 430ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
#enemy-panel.slash-x-red .enemy-panel-slash-2 {
  top: 100%;
  left: 0%;
  height: 18px;
  animation: enemySlashX2BlToTr 480ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes enemySlashX2BlToTr {
  0%, 11% {
    transform: translateY(-50%) rotate(calc(-1 * var(--ep-diag-angle, 9deg))) translateX(0%) scaleX(0) scaleY(0.65);
    opacity: 0;
  }
  12% {
    transform: translateY(-50%) rotate(calc(-1 * var(--ep-diag-angle, 9deg))) translateX(0%) scaleX(0.05) scaleY(0.75);
    opacity: 1;
  }
  36% {
    transform: translateY(-50%) rotate(calc(-1 * var(--ep-diag-angle, 9deg))) translateX(0%) scaleX(1) scaleY(1.12);
    opacity: 1;
  }
  50% {
    transform: translateY(-50%) rotate(calc(-1 * var(--ep-diag-angle, 9deg))) translateX(8%) scaleX(0.92) scaleY(1);
    opacity: 1;
  }
  96% {
    transform: translateY(-50%) rotate(calc(-1 * var(--ep-diag-angle, 9deg))) translateX(100%) scaleX(0) scaleY(0.4);
    opacity: 1;
  }
  100% {
    transform: translateY(-50%) rotate(calc(-1 * var(--ep-diag-angle, 9deg))) translateX(100%) scaleX(0) scaleY(0.2);
    opacity: 0;
  }
}

/* X 交叉中心聚能白光核心與紅色衝擊波環 */
.slash-x-center-burst {

  top: 50%;

  transform: translate(-50%, -50%);

}

}
@keyframes slashXRingExpand {

/* (2) 【捨身決絕】：勇者對話框先閃暗紅光（隨後觸發 slash-x-red 雙倍粗紅色交叉刀光） */
#dialogue-stage.glow-dark-red {

}

}
.enemy-flame-burst {

}

}
@keyframes flameIconScaleFade {

  100% { opacity: 0; transform: scale(1.45) translateY(-10px); }
}

}

}

/* (4) 【破綻洞悉】與【凝神聚氣】：敵人面板中央紅／綠色十字準星鎖定框 ＋ 紅邊／綠邊／黃綠邊加粗刀光 */
.enemy-crosshair-fx {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 58px;
  height: 58px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 15;
  border: 2px solid var(--ch-color, #ff4d4d);
  box-shadow: 0 0 14px var(--ch-color, #ff4d4d), inset 0 0 8px var(--ch-color, #ff4d4d);
  border-radius: 50%;
  animation: crosshairLockPulse 1040ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.enemy-crosshair-fx::before,
.enemy-crosshair-fx::after {
  content: "";
  position: absolute;
  background: var(--ch-color, #ff4d4d);
  box-shadow: 0 0 8px var(--ch-color, #ff4d4d);
}
.enemy-crosshair-fx::before {
  left: -10px;
  right: -10px;
  top: 50%;
  height: 2px;
  transform: translateY(-50%);
}
.enemy-crosshair-fx::after {
  top: -10px;
  bottom: -10px;
  left: 50%;
  width: 2px;
  transform: translateX(-50%);
}
@keyframes crosshairLockPulse {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(1.65) rotate(-25deg); }
  38% { opacity: 1; transform: translate(-50%, -50%) scale(0.95) rotate(0deg); }
  72% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
}

  left: 0%;

  box-shadow: -2px -2px 10px rgba(56, 211, 153, 0.38), 2px 2px 10px rgba(255, 210, 63, 0.38), inset 3px 0 0 #38d399;
}

/* 凝神聚氣：骰子框或撲克牌外框閃亮綠光 */
#dice .face.force-max-green-glow,
#poker-draw .drawn-card-wrapper.force-max-green-glow .poker-card {
  border-color: #38d399 !important;
  box-shadow: 0 0 24px 6px rgba(56, 211, 153, 0.9), inset 0 0 14px rgba(56, 211, 153, 0.55) !important;
}

/* (5) 點擊不跳過攻擊技能時的對話框邊框啟動微光 */
#dialogue-stage.glow-orange-micro { animation: microGlowOrange 680ms ease-out; }
#dialogue-stage.glow-green-micro { animation: microGlowGreen 680ms ease-out; }
#dialogue-stage.glow-yellow-micro { animation: microGlowYellow 680ms ease-out; }
@keyframes microGlowOrange {
  50% { border-color: #ff6b00; box-shadow: 0 0 14px rgba(255, 107, 0, 0.65), inset 0 0 10px rgba(255, 107, 0, 0.3); }
}
@keyframes microGlowGreen {
  50% { border-color: #38d399; box-shadow: 0 0 14px rgba(56, 211, 153, 0.65), inset 0 0 10px rgba(56, 211, 153, 0.3); }
}
@keyframes microGlowYellow {
  50% { border-color: #ffd23f; box-shadow: 0 0 14px rgba(255, 210, 63, 0.65), inset 0 0 10px rgba(255, 210, 63, 0.3); }
}

/* (6) 對話框由下往上掃過「黃色六角網格光效」或「綠色回血波紋」 */
.dialogue-sweep-fx {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 15;
  opacity: 0;
}
.dialogue-sweep-fx.sweep-yellow-grid {
  background-image:
    linear-gradient(to top, rgba(255, 210, 63, 0.38) 0%, rgba(255, 232, 133, 0.16) 55%, transparent 100%),
    repeating-linear-gradient(60deg, rgba(255, 210, 63, 0.25) 0px, rgba(255, 210, 63, 0.25) 1px, transparent 1px, transparent 14px),
    repeating-linear-gradient(-60deg, rgba(255, 210, 63, 0.25) 0px, rgba(255, 210, 63, 0.25) 1px, transparent 1px, transparent 14px);
  border-top: 2px solid #ffe885;
  box-shadow: 0 -6px 18px rgba(255, 210, 63, 0.65);
  animation: sweepBottomToTop 960ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.dialogue-sweep-fx.sweep-green-wave {
  background: linear-gradient(
    to top,
    rgba(56, 211, 153, 0.05) 0%,
    rgba(56, 211, 153, 0.36) 50%,
    rgba(167, 243, 208, 0.55) 85%,
    transparent 100%
  );
  border-top: 2px solid #a7f3d0;
  box-shadow: 0 -6px 18px rgba(56, 211, 153, 0.65);
  animation: sweepBottomToTop 920ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes sweepBottomToTop {
  0% { opacity: 0; transform: translateY(100%); }
  20% { opacity: 1; }
  80% { opacity: 0.95; }
  100% { opacity: 0; transform: translateY(-100%); }
}

/* (7) 【護盾反震】：從勇者對話框向外擴散至螢幕邊界的黃色圓形波紋 */
.reflect-expand-ring {
  position: fixed;
  border-radius: 50%;
  border: 3px solid #ffd23f;
  box-shadow: 0 0 18px 4px rgba(255, 210, 63, 0.85), inset 0 0 14px rgba(255, 232, 133, 0.65);
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 41;
}

/* (8) 【晶化壁壘】：維持整回合的加粗黃色雙層亮框（回合結束平滑淡出） */
#dialogue-stage.crystal-wall-active {
  border: 2px solid #ffe885 !important;
  box-shadow: 0 0 14px rgba(255, 210, 63, 0.65), inset 0 0 0 3px rgba(255, 210, 63, 0.35), inset 0 0 12px rgba(255, 210, 63, 0.25) !important;
  transition: border-color 320ms ease, box-shadow 320ms ease;
}

/* (9) 【全神蓄勢】：本回合勇者數值面板（#status）被半透明綠色六角形防護網格覆蓋 ＋ 蓄力綠光圈向中心收縮聚攏動畫 */
#status .hero-status-hex-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 4;
  border-radius: 2px;
  opacity: 0;
  transition: opacity 320ms ease, filter 240ms ease, box-shadow 240ms ease;
  background-image:
    radial-gradient(circle at 50% 50%, rgba(56, 211, 153, 0.22) 0%, rgba(16, 185, 129, 0.10) 68%, rgba(56, 211, 153, 0.04) 100%),
    repeating-linear-gradient(60deg, rgba(110, 231, 183, 0.30) 0px, rgba(110, 231, 183, 0.30) 1.2px, transparent 1.2px, transparent 12px),
    repeating-linear-gradient(-60deg, rgba(110, 231, 183, 0.30) 0px, rgba(110, 231, 183, 0.30) 1.2px, transparent 1.2px, transparent 12px),
    repeating-linear-gradient(0deg, rgba(56, 211, 153, 0.20) 0px, rgba(56, 211, 153, 0.20) 1px, transparent 1px, transparent 12px);
  box-shadow: inset 0 0 16px rgba(56, 211, 153, 0.42);
}
#status.status-dmg-reduce-active {
  border-color: #38d399 !important;
  box-shadow: 0 0 16px rgba(56, 211, 153, 0.55), inset 0 0 12px rgba(56, 211, 153, 0.28) !important;
  transition: border-color 300ms ease, box-shadow 300ms ease;
}
#status.status-dmg-reduce-active .hero-status-hex-overlay {
  opacity: 1;
  animation: heroStatusHexPulse 1400ms ease-in-out infinite alternate;
}
#status.status-dmg-reduce-hit .hero-status-hex-overlay {
  opacity: 1;
  filter: brightness(1.75);
  box-shadow: inset 0 0 26px rgba(167, 243, 208, 0.9);
}
@keyframes heroStatusHexPulse {
  0% { opacity: 0.78; }
  100% { opacity: 1; }
}
#dialogue-stage.charge-dmg-reduce-active {
  border-color: #38d399 !important;
  box-shadow: 0 0 12px rgba(56, 211, 153, 0.45), inset 0 0 10px rgba(56, 211, 153, 0.18) !important;
  transition: border-color 300ms ease, box-shadow 300ms ease;
}
.charge-condense-ring {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 240px;
  height: 240px;
  border-radius: 50%;
  border: 2.5px solid #38d399;
  box-shadow: 0 0 18px #38d399, inset 0 0 14px #38d399;
  transform: translate(-50%, -50%) scale(1.3);
  pointer-events: none;
  z-index: 16;
  animation: chargeRingCondense 840ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
}
@keyframes chargeRingCondense {
  0% { opacity: 0.2; transform: translate(-50%, -50%) scale(1.35); }
  30% { opacity: 1; }
  90% { opacity: 1; transform: translate(-50%, -50%) scale(0.05); background: rgba(56, 211, 153, 0.85); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(0.02); }
}

/* =========================================================
   第 16.1 版（v16.1）新增：
   1. 頂部勇者面板與二階段魔王面板「字印徽章」（［刺・杖・革・盾］幽紫色烙印）
   2. 二階段魔王前半血「亂碼障壁（0～67 黑底白字亂碼遮罩）」與半血向下掉落消失動畫

   5. 勇者後半血「真名精神污染」30% 眩暈（文字不斷放大縮小與搖晃）動畫
   6. 第 1～5 層「戰技殘頁」黑幕中央 3 個長方框技能卡片選擇介面（下方附「不選擇技能」按鈕）
   ========================================================= */

/* ── 1. 頂部與二階段面板「字印徽章」（設定 B・選項 4A） ── */
.word-seal-badge {
  display: inline-flex;
  align-items: center;

  border-radius: 2px;
  font-size: 12.5px;
  font-weight: bold;

  color: #d8b4fe;
  background: rgba(147, 51, 234, 0.16);

/* ── 2. 二階段前半血「0～67 亂碼障壁」血條遮罩與半血下落消失動畫（選項 2A） ── */
.garbled-hp-cover {
  position: absolute;
  top: 0;
  left: 0;
  width: 50%; /* 覆蓋 0～67 (67/135 ≈ 49.6%) 左半邊血條 */
  height: 100%;
  background: #08060c;
  border-right: 1.5px solid #e040fb;
  color: #ffffff;
  font-size: 10px;
  font-weight: bold;
  line-height: 10px;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  white-space: nowrap;
  z-index: 4;
  user-select: none;
  text-shadow: 0 0 4px #e040fb;
  box-shadow: inset 0 0 6px rgba(224, 64, 251, 0.45);
}
.garbled-hp-cover.hidden {
  display: none !important;
}

.falling-garbled-char {
  position: fixed;
  pointer-events: none;
  z-index: 44;
  color: #ffffff;

  font-size: 12px;

  text-shadow: 0 0 6px #e040fb, 0 0 10px #ffffff;
}

/* ── 3. 二階段後半血「原典黑盾」深灰黑配色（與純黑背景清楚區分） ── */
.bar-fill.shield-fill.dark-origin-shield {
  background: linear-gradient(90deg, #232030 0%, #3a354d 50%, #1d1a29 100%) !important;
  box-shadow: inset 0 0 0 1px rgba(226, 214, 255, 0.68), 0 0 8px rgba(167, 139, 250, 0.48) !important;
}

/* ── 4. 半血揭露真名時敵人面板名稱抖動碎裂 ＆ 二階段勝利真名裂痕崩解動畫 ── */
.true-name-shatter-reveal {
  display: inline-block;
  animation: trueNameShatterReveal 1200ms cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes trueNameShatterReveal {
  0% { transform: scale(1.35) translate(-4px, 2px); filter: brightness(2.4) blur(1px); color: #e040fb; }
  15% { transform: scale(0.9) translate(5px, -3px); }
  30% { transform: scale(1.25) translate(-3px, -2px); filter: brightness(2); color: #ffffff; }
  45% { transform: scale(0.95) translate(3px, 2px); }
  65% { transform: scale(1.12) translate(0, 0); color: #ff1744; text-shadow: 0 0 16px #ff1744, 0 0 28px #ff1744; }
  100% { transform: scale(1); text-shadow: none; }
}

#story .text.dizzy-stun-text {
  animation: storyDizzyWobble 720ms ease-in-out infinite alternate;
  color: #f0abfc !important;
  text-shadow: 0 0 16px rgba(224, 64, 251, 0.85), 4px 0 2px rgba(255, 23, 68, 0.65), -4px 0 2px rgba(77, 166, 255, 0.65) !important;
}
@keyframes storyDizzyWobble {
  0% { transform: scale(0.86) rotate(-3.5deg) translate(-6px, 3px); }
  50% { transform: scale(1.18) rotate(3.5deg) translate(6px, -4px); }
  100% { transform: scale(0.92) rotate(-2.5deg) translate(-4px, -2px); }
}

.true-name-collapse-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  user-select: none;
}
.true-name-collapse-title {
  position: relative;
  font-size: 48px;
  font-weight: bold;
  letter-spacing: 8px;
  color: #ff1744;
  text-shadow: 0 0 20px rgba(255, 23, 68, 0.95), 0 0 42px rgba(255, 23, 68, 0.65);
  display: flex;
  gap: 6px;
}
@media (max-width: 480px) {
  .true-name-collapse-title {
    font-size: 34px;
    letter-spacing: 4px;
  }
}
.true-name-char {
  position: relative;
  display: inline-block;
}
.true-name-collapse-wrap.cracking .true-name-char {
  animation: trueNameCharShake 140ms linear infinite;
}
.true-name-collapse-wrap.cracking .true-name-char::after {
  content: "";
  position: absolute;
  inset: -4px;
  background:
    linear-gradient(125deg, transparent 43%, #ffffff 47%, #ff99ac 50%, transparent 54%),
    linear-gradient(55deg, transparent 45%, #ffffff 49%, transparent 53%);
  pointer-events: none;
}
@keyframes trueNameCharShake {
  0% { transform: translate(-2px, 1px) rotate(-1deg); }
  50% { transform: translate(2px, -2px) rotate(1.5deg); }
  100% { transform: translate(-1px, 2px) rotate(-1deg); }
}

/* ── 5. 第 1～5 層「戰技殘頁」黑幕中央 3 個長方框技能選擇卡片（設定 C・選項 5A） ── */
#skill-choice-modal {
  position: fixed;
  inset: 0;
  z-index: 35;
  background: rgba(0, 0, 0, 0.86);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  gap: 12px;
  overflow-y: auto;
}
#skill-choice-modal.hidden {
  display: none !important;
}
.skill-choice-container {
  width: 100%;
  max-width: 680px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 92vh;
  overflow-y: auto;
  padding: 6px 4px;
}
.skill-choice-header {
  text-align: center;
  font-size: 17px;
  font-weight: bold;
  color: #ffffff;
  letter-spacing: 1.5px;
  margin-bottom: 2px;
}
.skill-choice-sub {
  text-align: center;
  font-size: 13px;
  color: #a0aab8;
  margin-bottom: 4px;
}
.skill-choice-cards {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.skill-choice-rect {
  width: 100%;
  background: #060913;
  border: 1.5px solid #888;
  border-left-width: 5px;
  border-radius: 3px;
  padding: 12px 15px;
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 6px;
  color: #e8e8e8;
  font-family: inherit;
  transition: transform 90ms ease, box-shadow 160ms ease, background-color 160ms ease, border-color 160ms ease;
}
.skill-choice-rect.cat-attack {
  border-color: rgba(255, 77, 77, 0.65);
  border-left-color: #ff4d4d;
  box-shadow: 0 0 12px rgba(255, 77, 77, 0.18);
}
.skill-choice-rect.cat-defense {
  border-color: rgba(255, 210, 63, 0.65);
  border-left-color: #ffd23f;
  box-shadow: 0 0 12px rgba(255, 210, 63, 0.18);
}
.skill-choice-rect.cat-charge {
  border-color: rgba(56, 211, 153, 0.65);
  border-left-color: #38d399;
  box-shadow: 0 0 12px rgba(56, 211, 153, 0.18);
}
@media (hover: hover) and (pointer: fine) {
  .skill-choice-rect.cat-attack:hover {
    background: #1c080b;
    border-color: #ff6b6b;
    box-shadow: 0 0 18px rgba(255, 77, 77, 0.45);
  }
  .skill-choice-rect.cat-defense:hover {
    background: #1c1606;
    border-color: #ffe066;
    box-shadow: 0 0 18px rgba(255, 210, 63, 0.45);
  }
  .skill-choice-rect.cat-charge:hover {
    background: #061c14;
    border-color: #6ee7b7;
    box-shadow: 0 0 18px rgba(56, 211, 153, 0.45);
  }
}
.skill-choice-rect .rect-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.skill-choice-rect .rect-name {
  font-size: 16.5px;
  font-weight: bold;
  color: #ffffff;
  letter-spacing: 1px;
}
.skill-choice-rect .rect-desc {
  font-size: 13.8px;
  color: #d0d8e8;
  line-height: 1.5;
}
.skill-choice-skip-btn {
  margin-top: 4px;
  width: 100%;
  background: #050508;
  color: #cccccc;
  border: 1px solid #888888;
  font-family: inherit;
  font-size: 15px;

@media (hover: hover) and (pointer: fine) {

    background: #e8e8e8;
    color: #000000;
    border-color: #ffffff;
  }
}
#equip-anim-overlay,
#text-fade-overlay,
#battle-intro-overlay {
  cursor: pointer;
}

<body>
<!-- 標題畫面 -->
<div id="title-screen" class="screen">
  <div class="logo" id="title-logo"></div>
  <div class="sub" id="title-sub"></div>
  <div class="sub"><span class="cursor">▌</span></div>

    <button id="btn-start">開始遊戲</button>

<div id="intro-screen" class="screen hidden">

    <button id="btn-intro-start">開始遊戲</button>
  </div>
</div>

<div id="compendium-screen" class="screen hidden">
  <div class="compendium-header">
    <h2 class="compendium-title">【局內技能圖鑑】</h2>

      <button type="button" class="comp-tab active" data-cat="all">全部 (15)</button>
      <button type="button" class="comp-tab tab-attack" data-cat="attack">攻擊類 (5)</button>
      <button type="button" class="comp-tab tab-defense" data-cat="defense">防禦類 (5)</button>
      <button type="button" class="comp-tab tab-charge" data-cat="charge">蓄力類 (5)</button>
    </div>

  <div class="box compendium-list" id="compendium-box"></div>
  <div class="menu">
    <button id="btn-compendium-back">返回</button>

<div id="dice" aria-live="polite">

        <div class="drawn-face front"></div>
        <div class="drawn-face back"></div>
      </div>
    </div>
    <div class="value-badge"></div>
    <div class="note"></div>

<!-- 勇者揮劍動畫 -->
<div id="sword" aria-hidden="true">
  <div class="slash"></div>
  <svg class="blade" viewBox="0 0 40 200" width="40" height="200">
    <polygon points="20,0 28,18 28,140 12,140 12,18" fill="#e8e8e8" stroke="#ffffff" stroke-width="1"/>
    <line x1="20" y1="12" x2="20" y2="136" stroke="#9a9a9a" stroke-width="2"/>
    <rect x="0" y="140" width="40" height="8" fill="#4da6ff"/>
    <rect x="15" y="148" width="10" height="38" fill="#8a6a3a"/>
    <circle cx="20" cy="192" r="7" fill="#4da6ff"/>
  </svg>

/* ===== 小工具 ===== */
function escapeHtml(t) {
  return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function escapeRegExp(s) {
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function buildNameRegex() {
  const escapedKeys = Object.keys(ENEMY_COLORS)
    .sort((a, b) => b.length - a.length)
    .map(escapeRegExp);
  const htmlEscapedHidden = escapeRegExp(escapeHtml(PHASE2_BOSS_HIDDEN_NAME));
  if (!escapedKeys.includes(htmlEscapedHidden)) {
    escapedKeys.push(htmlEscapedHidden);
  }
  return new RegExp("(勇者)|(" + escapedKeys.join("|") + ")", "g");
}

const NAME_REGEX = buildNameRegex();

function colorize(html) {
  return html.replace(NAME_REGEX, (m, isHero) => {
    if (isHero) return `<span class="name" style="color:${HERO_COLOR}">${m}</span>`;
    const rawKey = m.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"');
    const isBoss = (rawKey === "文字魔王" || rawKey === PHASE2_BOSS_HIDDEN_NAME || rawKey === PHASE2_BOSS_TRUE_NAME || rawKey === "真魔王")
      ? " name-boss"
      : "";
    return `<span class="name${isBoss}" style="color:${ENEMY_COLORS[rawKey] || "#ff5c5c"}">${m}</span>`;
  });
}

// 跨面板飛行光點動畫（從 $fromEl 飛向 $toEl）
async function playParticlesBetween($fromEl, $toEl, colorHex, count = 6, durationMs = 880) {
  if (!$fromEl || !$toEl || !$fxFlightLayer) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    await sleep(120);
    return;
  }
  const r1 = $fromEl.getBoundingClientRect();
  const r2 = $toEl.getBoundingClientRect();
  if (r1.width <= 0 || r2.width <= 0) return;
  const sx = r1.left + r1.width * 0.5;
  const sy = r1.top + r1.height * 0.5;
  const ex = r2.left + r2.width * 0.5;
  const ey = r2.top + r2.height * 0.5;

  const promises = [];
  for (let i = 0; i < count; i++) {
    const dot = document.createElement("div");
    dot.className = "fx-flying-dot";
    dot.style.setProperty("--dot-color", colorHex || "#38d399");
    dot.style.setProperty("--dot-size", count === 1 ? "11px" : "8px");
    const ox = (count === 1) ? 0 : (Math.random() - 0.5) * Math.min(80, r1.width * 0.5);
    const oy = (count === 1) ? 0 : (Math.random() - 0.5) * Math.min(36, r1.height * 0.5);
    const mx = (sx + ex) * 0.5 + (Math.random() - 0.5) * 40;
    const my = (sy + ey) * 0.5 - 18;
    $fxFlightLayer.appendChild(dot);

    const delay = i * 70;
    const anim = dot.animate([
      { left: (sx + ox) + "px", top: (sy + oy) + "px", opacity: 0.95, transform: "translate(-50%, -50%) scale(0.9)" },
      { left: mx + "px", top: my + "px", opacity: 1, transform: "translate(-50%, -50%) scale(1.15)", offset: 0.5 },
      { left: ex + "px", top: ey + "px", opacity: 0.2, transform: "translate(-50%, -50%) scale(0.5)" },
    ], { duration: durationMs, delay, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "forwards" });

    promises.push(anim.finished.catch(() => {}).then(() => { dot.remove(); }));
  }
  await Promise.all(promises);
}

  await playParticlesBetween($dialogueStage, $targetTag, "#38d399", 1, 700);

  if (onBuffAppearCallback) onBuffAppearCallback();
}

// 當指定 Buff 效果消耗完畢時：對應的 Buff 標籤化為對應顏色（紅／黃／綠）光點向上向外飛走消失
async function playSpecificBuffsFlyAwayAnim(buffSpecs) {
  const $tagContainer = document.getElementById("hero-panel-tag");
  if (!$tagContainer || !$fxFlightLayer || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if (!Array.isArray(buffSpecs) || buffSpecs.length === 0) return;

  const animations = [];
  buffSpecs.forEach(({ keyPrefix, color }) => {
    const pills = Array.from($tagContainer.querySelectorAll(".hero-buff-pill")).filter(el => {
      const k = el.dataset.buffKey || "";
      return k === keyPrefix || k.startsWith(keyPrefix);
    });
    const targets = pills.length > 0 ? pills : [$tagContainer];
    targets.forEach((el, idx) => {
      const r = el.getBoundingClientRect();
      if (r.width <= 0 && r.height <= 0) return;
      const sx = r.left + r.width * 0.5;
      const sy = r.top + r.height * 0.5;

      const dot = document.createElement("div");
      dot.className = "fx-flying-dot";
      dot.style.setProperty("--dot-color", color || "#38d399");
      dot.style.setProperty("--dot-size", "10px");
      $fxFlightLayer.appendChild(dot);

      const offsetX = 48 + idx * 18;
      const anim = dot.animate([
        { left: sx + "px", top: sy + "px", opacity: 1, transform: "translate(-50%, -50%) scale(1.1)" },
        { left: (sx + offsetX) + "px", top: Math.max(4, sy - 42) + "px", opacity: 0, transform: "translate(-50%, -50%) scale(0.2)" },
      ], { duration: 840, easing: "ease-out", fill: "forwards" });
      animations.push(anim.finished.catch(() => {}).then(() => { dot.remove(); }));
    });
  });

  if (animations.length > 0) {
    await Promise.all(animations);
  }
}

// 向下相容舊呼叫：預設飛走所有蓄力類 Buff 綠光點
async function playBuffFlyAwayAnim() {
  await playSpecificBuffsFlyAwayAnim([{ keyPrefix: "charge_", color: "#38d399" }]);
}

// 【護盾反震】：受擊同時從勇者對話框向外擴散一圈黃色圓形波紋，碰到敵人面板時造成傷害，並持續擴散至螢幕邊界
async function playReflectWaveAnim(onTouchEnemyCallback) {
  if (!$dialogueStage || !$fxFlightLayer || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    if (onTouchEnemyCallback) await onTouchEnemyCallback();
    return;
  }
  const dRect = $dialogueStage.getBoundingClientRect();
  const cx = dRect.left + dRect.width * 0.5;
  const cy = dRect.top + dRect.height * 0.5;
  const maxRadius = Math.hypot(window.innerWidth, window.innerHeight) * 1.15;
  const maxDiam = maxRadius * 2;

  const ring = document.createElement("div");
  ring.className = "reflect-expand-ring";
  ring.style.left = cx + "px";
  ring.style.top = cy + "px";
  $fxFlightLayer.appendChild(ring);

  const totalMs = 1480;
  const touchMs = 460;
  const anim = ring.animate([
    { width: "24px", height: "24px", opacity: 0.98 },
    { width: (maxDiam * 0.42) + "px", height: (maxDiam * 0.42) + "px", opacity: 0.92, offset: 0.35 },
    { width: maxDiam + "px", height: maxDiam + "px", opacity: 0 },
  ], { duration: totalMs, easing: "cubic-bezier(0.16, 1, 0.3, 1)", fill: "forwards" });

  await sleep(touchMs);
  let hitPromise = Promise.resolve();
  if (onTouchEnemyCallback) {
    hitPromise = onTouchEnemyCallback();
  }
  await Promise.all([anim.finished.catch(() => {}), hitPromise]);
  ring.remove();
}

function hexToRgba(hex, alpha) {
  const clean = String(hex || "#ff5c5c").replace("#", "");
  if (clean.length !== 6) return `rgba(255, 92, 92, ${alpha})`;
  const r = parseInt(clean.slice(0, 2), 16);
  const g = parseInt(clean.slice(2, 4), 16);
  const b = parseInt(clean.slice(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}
