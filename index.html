<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勇者與魔王</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 標題畫面 -->
<div id="title-screen" class="screen">
  <div class="logo" id="title-logo"></div>
  <div class="sub" id="title-sub"></div>
  <div class="sub"><span class="cursor">▌</span></div>
  <div class="menu" id="title-main-menu">
    <button id="btn-start">開始遊戲</button>
    <button id="btn-intro">遊戲介紹</button>
  </div>
  <div class="menu hidden" id="title-mode-menu">
    <div class="mode-prompt" id="mode-prompt-title">請選擇本局遊戲模式：</div>
    <button id="btn-mode-dice">骰子模式</button>
    <button id="btn-mode-poker">撲克模式</button>
    <button id="btn-mode-back">返回</button>
  </div>
</div>

<!-- 遊戲介紹畫面 -->
<div id="intro-screen" class="screen hidden">
  <div class="box" id="intro-box"></div>
  <div class="menu">
    <button id="btn-back">返回</button>
    <button id="btn-intro-start">開始遊戲</button>
  </div>
</div>

<!-- 擲骰動畫（骰子模式） -->
<div id="dice" aria-live="polite">
  <div class="dice-box">
    <div class="who"></div>
    <div class="face">0</div>
    <div class="note"></div>
  </div>
</div>

<!-- 抽撲克牌動畫（撲克模式：先洗牌後抽一張牌翻開） -->
<div id="poker-draw" aria-live="polite">
  <div class="poker-box">
    <div class="who"></div>
    <div class="stage-label"></div>
    <div class="card-stage">
      <div class="deck-stack">
        <div class="deck-card"></div>
        <div class="deck-card"></div>
        <div class="deck-card"></div>
        <div class="deck-card"></div>
      </div>
      <div class="drawn-card-wrapper">
        <div class="drawn-face front"></div>
        <div class="drawn-face back"></div>
      </div>
    </div>
    <div class="value-badge"></div>
    <div class="note"></div>
  </div>
</div>

<!-- 勇者揮劍動畫 -->
<div id="sword" aria-hidden="true">
  <div class="slash"></div>
  <svg class="blade" viewBox="0 0 40 200" width="40" height="200">
    <polygon points="20,0 28,18 28,140 12,140 12,18" fill="#e8e8e8" stroke="#ffffff" stroke-width="1"/>
    <line x1="20" y1="12" x2="20" y2="136" stroke="#9a9a9a" stroke-width="2"/>
    <rect x="0" y="140" width="40" height="8" fill="#4da6ff"/>
    <rect x="15" y="148" width="10" height="38" fill="#8a6a3a"/>
    <circle cx="20" cy="192" r="7" fill="#4da6ff"/>
  </svg>
</div>
